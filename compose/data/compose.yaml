# compose/data/compose.yaml — PostgreSQL for the three lanes.
#
# Database `hospital`. Vault connects as `vault_mgmt` (CREATEROLE, no
# superuser); the static role rotates `surgeon_svc`. Their initial passwords
# come from .secrets/postgres.env (generated by `make data-up`), mounted as a
# file and read by postgres/init/02-roles.sh, never put in the environment.
# The init scripts run only on an empty volume.

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: srot-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?run make env-init}"
      POSTGRES_DB: "${SROT_DB_NAME}"
      SROT_DB_NAME: "${SROT_DB_NAME}"
      SROT_DB_MGMT_USER: "${SROT_DB_MGMT_USER}"
      SROT_DB_STATIC_USER: "${SROT_DB_STATIC_USER}"
    ports: ["127.0.0.1:${SROT_PORT_POSTGRES}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data                              # persistent
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro                  # host
      - ../../.secrets/postgres.env:/run/secrets/postgres.env:ro            # host: initial role passwords
    restart: unless-stopped
    mem_limit: 512m
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  default:
    name: srot-internal
    external: true

volumes:
  postgres-data:
    labels: { io.srot.data: "true" }

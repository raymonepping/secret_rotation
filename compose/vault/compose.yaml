# compose/vault/compose.yaml — vault-1, the application Vault.
#
# Auto-unseals through vault-s (seal "transit" in its HCL). The Transit token
# is delivered as a file and read once at process start by vault-server.sh:
# the seal agent's sink first, the bootstrap token as fallback. There is no
# VAULT_TOKEN in the compose environment. Start order is handled by
# `make vault-up`: vault-s must be unsealed before vault-1 can unseal.

services:
  vault-1:
    image: ${VAULT_IMAGE}
    container_name: srot-vault-1
    hostname: vault-1
    user: "100:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/config/tls/ca-chain.pem
      VAULT_LICENSE: "${VAULT_LICENSE:-}"
    entrypoint: ["/bin/sh", "/srot/vault-server.sh"]
    ports: ["127.0.0.1:${SROT_PORT_VAULT_1}:8200"]
    volumes:
      - vault-1-data:/vault/file        # persistent: Raft data
      - vault-1-audit:/vault/audit      # persistent: audit log
      - ../../vault/vault-1/config.hcl:/vault/config/config.hcl:ro         # host
      - ../../vault-tls:/vault/config/tls:ro                                # host
      - ../../scripts/vault-server.sh:/srot/vault-server.sh:ro              # host
      - ../../.secrets/vault/transit-token:/run/secrets/transit-token:ro    # host: bootstrap fallback
      - seal-token:/run/secrets/seal:ro                                      # seal agent sink: preferred
    restart: unless-stopped
    mem_limit: 1g
    networks: [default]
    healthcheck:
      # Healthy = the process answers (200 active, 429 standby, 503 sealed,
      # 501 uninitialized are all "process is fine"). $$ escapes $.
      test: ["CMD-SHELL", "S=$$(wget -S -qO/dev/null --no-check-certificate 'https://127.0.0.1:8200/v1/sys/health' 2>&1 | awk '/^ *HTTP\\//{print $$2; exit}'); [ -n \"$$S\" ]"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

networks:
  default:
    name: srot-internal
    external: true

volumes:
  vault-1-data:
    labels: { io.srot.data: "true" }
  vault-1-audit:
    labels: { io.srot.data: "true" }
  # Written by the seal agent (compose/seal).
  seal-token:
    external: true
    name: srot-seal_seal-token
